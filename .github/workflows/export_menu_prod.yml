name: Render Menu - Prod

on:
  workflow_dispatch:
  schedule:
    # Ogni 30 minuti dalle 09:00 alle 12:00 UTC
    # Inverno (UTC+1): 10:00 - 13:00 ora italiana
    # Estate (UTC+2): 11:00 - 14:00 ora italiana
    - cron: '0,30 9,10,11 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Installa dipendenze Python
        run: pip install -r requirements.txt

      - name: Installa dipendenze sistema Playwright
        run: playwright install-deps chromium

      - name: Installa Playwright + Chromium
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: playwright install chromium

      - name: Esegui script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY_PROD }}
          MENUS_FILE: config/menus_prod.csv
          SUPABASE_BUCKET: menus
        run: python menu_export.py